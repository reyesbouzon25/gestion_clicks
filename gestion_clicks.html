<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador de Clicks</title>

<style>
 body {background-color: rgb(135, 224, 195);
   text-align: center;
   font-family: Arial;}

 h1 {color: blue;}

 button {padding: 10px; cursor: pointer;}

 button:hover { background-color: #e0f712;}
</style>


</head>
<body>
  <h1>Contador de Clicks</h1>
  <button id="btn">Haz clic</button>
  <p id="contador">0</p>

  <script>
    let contador = 0;
    document.getElementById("btn").addEventListener("click", () => {
      contador++;
      document.getElementById("contador").innerText = contador;
    });
  </script>
</body>
</html>
